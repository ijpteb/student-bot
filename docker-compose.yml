services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: bot
      POSTGRES_DB: bot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Заполните POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Проверяем по сети (-h 127.0.0.1): при первом запуске база недолго работает только «внутри себя».
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U bot -d bot"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Порт базы наружу не открыт: к ней обращается только бот.

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://bot:${POSTGRES_PASSWORD}@db:5432/bot
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
